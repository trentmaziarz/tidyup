target: ~/Downloads
rules:
  - name: images
    match: ["*.jpg", "*.jpeg", "*.png", "*.gif"]
    dest: ~/Pictures/unsorted
  - name: pdfs
    match: ["*.pdf"]
    dest: ~/Documents/pdf
  - name: archives
    match: ["*.zip", "*.tar.gz", "*.7z"]
    dest: ~/Downloads/archives
  - name: old installers
    match: ["*.exe", "*.msi", "*.deb"]
    older_than: 30
    dest: trash
